# Dev-окружение: Postgres + backend (hot-reload) + webapp (Vite hot-reload)
# Запуск: cp .env.example .env && docker compose up --build
name: tochka-avtomatiki

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tochka_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tochka_db}
      POSTGRES_DB: ${POSTGRES_DB:-tochka_db}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tochka_db} -d ${POSTGRES_DB:-tochka_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tochka_db}:${POSTGRES_PASSWORD:-tochka_db}@db:5432/${POSTGRES_DB:-tochka_db}?schema=public
      PORT: ${PORT:-3000}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/backend/src:ro
      - ./backend/prisma.config.ts:/app/backend/prisma.config.ts:ro
      - /app/backend/node_modules
      - /app/node_modules
    command: sh -c "pnpm exec prisma generate && pnpm exec prisma migrate deploy && pnpm dev"

  webapp:
    build:
      context: .
      dockerfile: ./webapp/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_BACKEND_TRPC_URL: ${VITE_BACKEND_TRPC_URL:-http://localhost:3000/trpc}
      VITE_BACKEND_API_URL: ${VITE_BACKEND_API_URL:-http://localhost:3000/api}
    ports:
      - '5173:5173'
    depends_on:
      - backend
    volumes:
      - ./webapp/src:/app/webapp/src:ro
      - ./webapp/index.html:/app/webapp/index.html:ro
      - ./webapp/public:/app/webapp/public:ro
      - /app/webapp/node_modules
      - /app/node_modules

volumes:
  pgdata:
