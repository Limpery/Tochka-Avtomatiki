# Только PostgreSQL для локальной разработки. Backend и frontend запускаются через pnpm dev.
services:
  db:
    image: postgres:16-alpine
    container_name: robotics-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: robotics_platform
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d robotics_platform']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
